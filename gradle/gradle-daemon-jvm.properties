#
# Pins the Gradle daemon to a Java 25 toolchain.
#
# Without this the daemon runs on whatever `java` happens to be first on PATH.
# When that moved to a Java 27 early-access build, every Gradle invocation failed
# with "Unsupported class file major version 71" — including benchmark runs,
# which died silently and produced empty results.
#
# A version requirement rather than an absolute path: this repository is measured
# on several machines (Apple M5, Intel N97, AMD Ryzen) and each resolves its own
# JDK 25 from the toolchains Gradle detects. The compilation toolchain is set
# separately in build.gradle; this governs the daemon that runs the build itself.
#
toolchainVersion=25
