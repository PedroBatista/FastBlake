import org.gradle.process.ExecOperations

import javax.inject.Inject

plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

group 'eu.pedrobatista'
version '0.1.2'

base {
    archivesName = 'fastblake'
}

description = 'Dependency-free pure-JVM BLAKE3 implementation'

// The main jar is the library boundary. Harnesses, benchmarks and native
// contenders are deliberately separate source sets and are never runtime
// dependencies of this artifact.
def libraryJar = tasks.named('jar')

repositories {
    mavenCentral()
}

// The lowest JVM the published library runs on. This is a *compile-time*
// contract, enforced by options.release below: sourceCompatibility and
// targetCompatibility would set the class-file version without checking that
// the code stays inside the 21 API, which is how a too-new API call reaches a
// consumer's runtime as a NoSuchMethodError instead of a build failure.
//
// --release also constrains jdk.incubator.vector, not just java.base: javac's
// ct.sym carries historical incubator signatures, so a Vector API method that
// only exists in a later JDK fails the build here rather than at the consumer.
def baselineJava = 21

// The toolchain is deliberately *not* lowered to match. src/experiment,
// src/harness and src/jmh use java.lang.foreign, which is a preview API in 21
// and only final in 22; building them on 21 fails. Only the library jar carries
// the 21 promise, so only compileJava gets --release.
java {
    withSourcesJar()
    withJavadocJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

// compileJava carries the library's baseline promise. compileConsumerTestJava
// stands in for a downstream build, so it compiles at the baseline too —
// otherwise the smoke test's own class files are too new to load on the very
// JVM they are meant to prove the library works on.
// Matched lazily: consumerTest is created by the sourceSets block further down,
// so its compile task does not exist yet at this point in evaluation.
tasks.withType(JavaCompile)
        .matching { it.name in ['compileJava', 'compileConsumerTestJava'] }
        .configureEach {
            options.release = baselineJava
        }

// Consumers resolve against Gradle module metadata, not the class-file version.
// Without this attribute the metadata advertises the toolchain (25) and a 21
// consumer is told the library is incompatible.
configurations.matching { it.name in ['apiElements', 'runtimeElements'] }.configureEach {
    attributes {
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                baselineJava)
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('-add-modules', 'jdk.incubator.vector')
}

tasks.named('javadoc') {
    options.addStringOption('-release', baselineJava.toString())
}

ext {
    commonsCodecVersion = '1.22.0'
    junitVersion = '5.12.2'
    jmhVersion = '1.37'
    jolVersion = '0.17'
}

// ---------------------------------------------------------------------------
// Source layout
//
//   src/main     the implementations under development (Java CPU, later GPU)
//   src/experiment historical/candidate kernels; compiled for the laboratory,
//                 never included in the library jar
//   src/harness  contender adapters + official test vectors, shared by both
//                consumers below so tests and benchmarks measure the same code
//   src/test     conformance, run over every available contender
//   src/jmh      benchmarks, run over every available contender
//
// Only `main` ships. Commons Codec, JMH and the harness never reach the jar.
// ---------------------------------------------------------------------------
sourceSets {
    experiment {
        java.srcDirs = ['src/experiment/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    consumerTest {
        java.srcDirs = ['src/consumerTest/java']
        // Compile exactly as a downstream user does: against the generated
        // artifact, never against sourceSets.main.output.
        compileClasspath = files(tasks.named('jar').flatMap { it.archiveFile })
        runtimeClasspath = output + compileClasspath
    }
    harness {
        java.srcDirs = ['src/harness/java']
        resources.srcDirs = ['src/harness/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.harness.output
        runtimeClasspath += sourceSets.harness.output
    }
    jmh {
        java.srcDirs = ['src/jmh/java']
        compileClasspath += sourceSets.main.output + sourceSets.experiment.output + sourceSets.harness.output
        runtimeClasspath += sourceSets.main.output + sourceSets.experiment.output + sourceSets.harness.output
    }
}

configurations {
    experimentImplementation.extendsFrom implementation
}

configurations {
    testImplementation.extendsFrom harnessImplementation
    jmhImplementation.extendsFrom harnessImplementation
}

dependencies {
    // Apache Commons Codec is a contender and the correctness oracle. It is a
    // harness dependency only -- `main` has no dependencies and never will.
    harnessImplementation "commons-codec:commons-codec:${commonsCodecVersion}"
    // E027: retained-footprint measurement. Harness scope only; `main` stays
    // dependency-free.
    harnessImplementation "org.openjdk.jol:jol-core:${jolVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    jmhImplementation "org.openjdk.jmh:jmh-core:${jmhVersion}"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}"
}

// ---------------------------------------------------------------------------
// Rust contender (optional)
//
// The reference Rust implementation is compiled to a cdylib and called through
// the FFM API, so it is measured in-process on the same buffers as the Java
// contenders. This is strictly best-effort: no Rust toolchain, a broken crate
// build, or an unsupported platform must all leave `build`, `test` and `jmh`
// fully working, with the Rust contender simply reported as unavailable.
// ---------------------------------------------------------------------------
interface InjectedExec {
    @Inject
    ExecOperations getExecOps()
}

// Gradle's daemon often has a narrower PATH than an interactive shell, so look
// in the usual toolchain locations too before declaring cargo missing.
def cargoExecutable = {
    def dirs = []
    def envPath = System.getenv('PATH')
    if (envPath) {
        dirs.addAll(envPath.split(File.pathSeparator).findAll { it }.collect { new File(it) })
    }
    dirs << new File(System.getProperty('user.home'), '.cargo/bin')
    dirs << new File('/opt/homebrew/bin')
    dirs << new File('/usr/local/bin')
    def exeSuffix = System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''
    for (dir in dirs) {
        def candidate = new File(dir, "cargo${exeSuffix}")
        if (candidate.isFile() && candidate.canExecute()) {
            return candidate.absolutePath
        }
    }
    return null
}()

def nativeLibName = System.mapLibraryName('fastblake_rust')
def rustProjectDir = layout.projectDirectory.dir('native/rust-blake3')
def nativeStageDir = layout.buildDirectory.dir('native')

tasks.register('cargoBuild') {
    group = 'build'
    description = 'Builds the Rust BLAKE3 contender. Skipped, not failed, when cargo is unavailable.'

    def injected = objects.newInstance(InjectedExec)
    def rustDir = rustProjectDir.asFile
    def stageDir = nativeStageDir
    def cargo = cargoExecutable
    def libName = nativeLibName

    inputs.files(fileTree(rustDir) {
        include 'src/**'
        include 'Cargo.toml'
        include 'Cargo.lock'
    }).withPropertyName('rustSources')
    inputs.property('cargoExecutable', cargo ?: 'absent')
    outputs.dir(stageDir).withPropertyName('nativeStage')

    doLast {
        def dest = stageDir.get().asFile
        dest.mkdirs()
        def staged = new File(dest, libName)
        def status = new File(dest, 'rust-status.txt')
        staged.delete()

        if (cargo == null) {
            status.text = "unavailable\nNo cargo executable found on PATH or in the usual toolchain " +
                    "locations. Install Rust (https://rustup.rs) and re-run to enable the Rust contender."
            logger.lifecycle('cargoBuild: cargo not found -- Rust contender disabled.')
            return
        }

        def stdout = new ByteArrayOutputStream()
        def result = injected.execOps.exec {
            commandLine cargo, 'build', '--release'
            workingDir rustDir
            standardOutput = stdout
            errorOutput = stdout
            ignoreExitValue = true
        }

        if (result.exitValue != 0) {
            status.text = "unavailable\ncargo build --release failed with exit code ${result.exitValue}. " +
                    "Run it by hand in ${rustDir} to see why.\n\n${stdout}"
            logger.lifecycle("cargoBuild: cargo build failed (exit ${result.exitValue}) -- Rust contender disabled.")
            logger.info(stdout.toString())
            return
        }

        def built = new File(rustDir, "target/release/${libName}")
        if (!built.isFile()) {
            status.text = "unavailable\ncargo build succeeded but ${built} was not produced. " +
                    "Is the crate-type still cdylib for this platform?"
            logger.lifecycle('cargoBuild: no shared library produced -- Rust contender disabled.')
            return
        }

        staged.bytes = built.bytes
        status.text = "available\n${built}"
        logger.lifecycle("cargoBuild: staged ${libName} -- Rust contender enabled.")
    }
}

// Both consumers need the staged library (or the status file explaining its
// absence) before they run.
def configureNativeAccess = { task ->
    task.dependsOn tasks.named('cargoBuild')
    task.systemProperty 'fastblake.native.dir', nativeStageDir.get().asFile.absolutePath
    // FFM downcalls are a restricted operation; without this the JVM prints a
    // warning on every run that would otherwise look like a harness failure.
    task.jvmArgs '--enable-native-access=ALL-UNNAMED'
    task.jvmArgs '--add-modules=jdk.incubator.vector'
}

test {
    useJUnitPlatform()
    configureNativeAccess(it)
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Exercises the native AVX-512 batch shape even on a narrower development
// machine. The Vector API splits SPECIES_512 when necessary, so this is a
// correctness gate only -- never a performance measurement. A genuine
// AVX-512 host selects the same wide kernel automatically without these
// properties.
tasks.register('testWide512', Test) {
    group = 'verification'
    description = 'Runs the full suite through the sixteen-lane AVX-512 wide kernel.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    configureNativeAccess(it)
    systemProperty 'fastblake.kernel', 'wide'
    systemProperty 'fastblake.wideBits', '512'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// ./gradlew jmh                                     -> every available contender
// ./gradlew jmh -P'jmh.args=oneShot -p size=1024'   -> raw JMH args
// ./gradlew jmh -P'jmh.args=-p impl=rust,commons'   -> pick contenders explicitly
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Runs the BLAKE3 benchmarks across every available contender.'
    dependsOn tasks.named('jmhClasses')
    mainClass = 'eu.pedrobatista.fastblake.bench.BenchmarkRunner'
    classpath = sourceSets.jmh.runtimeClasspath
    configureNativeAccess(it)
    def rawArgs = (project.findProperty('jmh.args') ?: '').toString().trim()
    args = rawArgs.isEmpty() ? [] : rawArgs.split('\\s+').toList()
}

// A portable executable benchmark artifact for machines where invoking the
// Gradle build is inconvenient. It contains the library, harness, generated
// JMH benchmarks and their runtime dependencies, with a small JSON-producing
// entry point as its Main-Class. Native Rust is intentionally not embedded:
// the harness reports it unavailable unless the caller supplies a staged
// library through the normal fastblake.native.dir property.
tasks.register('testJar', Jar) {
    group = 'build'
    description = 'Builds the standalone benchmark/test fat JAR.'
    dependsOn tasks.named('jmhClasses')
    archiveClassifier = 'test'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('Main-Class': 'eu.pedrobatista.fastblake.TestBenchmarkMain')
    }
    from(sourceSets.main.output)
    from(sourceSets.harness.output)
    from(sourceSets.jmh.output)
    from({ configurations.jmhRuntimeClasspath
            .filter { it.isFile() }
            .collect { zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
}

// Transferable bundle for machines that do not have Gradle. The recipient
// supplies a compatible JDK path to the launcher; the bundle itself remains
// small and architecture-neutral, while the JVM selects AVX2/AVX-512/NEON at
// startup on the destination machine.
tasks.register('testBundleZip', Zip) {
    group = 'distribution'
    description = 'Packages the standalone benchmark JAR with JDK-path launchers.'
    dependsOn tasks.named('testJar')
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = "fastblake-test-${project.version}.zip"
    from(tasks.named('testJar')) {
        rename { 'fastblake-test.jar' }
    }
    from(layout.projectDirectory.dir('tools')) {
        include 'run-fastblake-benchmark.sh'
        filePermissions {
            unix('rwxr-xr-x')
        }
    }
    from(layout.projectDirectory.dir('tools')) {
        include 'run-fastblake-benchmark.bat'
    }
}

// Reports which contenders this machine can actually run, and why any are out.
tasks.register('contenders', JavaExec) {
    group = 'verification'
    description = 'Prints the availability of every BLAKE3 contender on this machine.'
    mainClass = 'eu.pedrobatista.fastblake.harness.Contenders'
    classpath = sourceSets.harness.runtimeClasspath
    configureNativeAccess(it)
}

// E025 P3. Benchmarks every selectable kernel on this machine and reports
// whether the one KernelSelector picked actually won.
//
// The dispatch table in KernelSelector encodes measured results, and a table
// nobody re-checks is an assumption rather than a measurement. This is the
// check. It matters because the ground moves: E024 measured a ~15% swing on
// identical code between two JDK builds, and a JDK on this machine changed
// underneath the build mid-session.
//
//   ./gradlew dispatchAudit
//   ./gradlew dispatchAudit -PauditSize=1048576 -PauditShape=streaming4k
tasks.register('dispatchAudit') {
    group = 'verification'
    description = 'Benchmarks every selectable kernel and checks the selector chose the best.'
    dependsOn tasks.named('jmhClasses')

    def injected = objects.newInstance(InjectedExec)
    def jmhClasspath = sourceSets.jmh.runtimeClasspath
    def nativeDir = nativeStageDir.get().asFile.absolutePath
    def javaLauncher = javaToolchains.launcherFor(java.toolchain)
    def size = (project.findProperty('auditSize') ?: '8388608').toString()
    def shape = (project.findProperty('auditShape') ?: 'oneShot').toString()
    def outputFile = layout.buildDirectory.file('dispatch-audit.txt')
    outputs.file(outputFile)
    // A measurement is never up to date: the answer depends on the machine, the
    // JDK and thermal state, none of which Gradle can see. Caching it would let
    // a stale verdict rubber-stamp a changed dispatch table.
    outputs.upToDateWhen { false }

    doLast {
        // E028: 'wide' is one chunk per lane at the machine's preferred width.
        // On a 128-bit machine it duplicates 'four' and the audit simply
        // reports two similar numbers; on AVX2 or AVX-512 this row is the
        // experiment E028 opened, and a MISMATCH verdict naming it is what
        // authorises changing the x86-64 branch of KernelSelector.
        def kernels = ['scalar', 'four', 'avx1', 'eight', 'wide']
        def scores = [:]
        def selected = null

        kernels.each { kernel ->
            logger.lifecycle("dispatchAudit: measuring ${kernel} at ${shape}/${size} ...")
            def out = new ByteArrayOutputStream()
            def result = injected.execOps.javaexec {
                executable = javaLauncher.get().executablePath.asFile.absolutePath
                classpath = jmhClasspath
                mainClass = 'eu.pedrobatista.fastblake.bench.BenchmarkRunner'
                systemProperty 'fastblake.native.dir', nativeDir
                // The kernel override must reach the JMH *fork*, not just this
                // host process. JMH child JVMs do not inherit arbitrary -D
                // flags, so an audit that set only a systemProperty measured
                // the same kernel three times and always reported "OK".
                // JAVA_TOOL_OPTIONS is inherited through the environment and is
                // how every other run in this project propagates the flag.
                environment 'JAVA_TOOL_OPTIONS', "-Dfastblake.kernel=${kernel}"
                jvmArgs '--enable-native-access=ALL-UNNAMED',
                        '--add-modules=jdk.incubator.vector'
                args shape, '-p', 'impl=java-cpu', '-p', "size=${size}",
                        '-f', '2', '-wi', '5', '-i', '5'
                standardOutput = out
                errorOutput = out
                ignoreExitValue = true
            }
            def text = out.toString()
            if (result.exitValue != 0) {
                logger.lifecycle("  ${kernel}: FAILED (exit ${result.exitValue})")
                logger.info(text)
                return
            }
            // The runner prints "<size label>  <MiB/s>" in its summary table.
            def score = null
            text.eachLine { line ->
                def m = line =~ /^\s{2,}\S+\s+(?:B|KiB|MiB)\s+([0-9]+)\s*$/
                if (m.find()) {
                    score = m.group(1) as int
                }
            }
            if (score == null) {
                logger.lifecycle("  ${kernel}: no score parsed")
                logger.info(text)
            } else {
                scores[kernel] = score
                logger.lifecycle("  ${kernel}: ${score} MiB/s")
            }
            // Every run prints the selection line; capture it once.
            text.eachLine { line ->
                if (selected == null && line.contains('-> ') && line.contains('java-cpu')) {
                    selected = line.trim()
                }
            }
        }

        if (scores.isEmpty()) {
            throw new GradleException('dispatchAudit produced no scores; see --info for output.')
        }

        def best = scores.max { it.value }
        // Map the automatic choice onto a kernel key. Run once more with no
        // override so the selector reports what it would pick unaided.
        def autoOut = new ByteArrayOutputStream()
        injected.execOps.javaexec {
            executable = javaLauncher.get().executablePath.asFile.absolutePath
            classpath = jmhClasspath
            mainClass = 'eu.pedrobatista.fastblake.harness.Contenders'
            systemProperty 'fastblake.native.dir', nativeDir
            jvmArgs '--enable-native-access=ALL-UNNAMED',
                    '--add-modules=jdk.incubator.vector'
            standardOutput = autoOut
            errorOutput = autoOut
            ignoreExitValue = true
        }
        def autoLine = autoOut.toString().readLines().find { it.contains('java-cpu') } ?: ''
        // WIDE is tested before FOUR_CHUNK only because neither substring is a
        // prefix of the other; order here is not significance.
        def autoKernel = autoLine.contains('AVX1_CHUNK') ? 'avx1'
                : autoLine.contains('EIGHT_CHUNK') ? 'eight'
                : autoLine.contains('FOUR_CHUNK') ? 'four'
                : autoLine.contains('WIDE') ? 'wide'
                : autoLine.contains('SCALAR') ? 'scalar' : null

        def report = new StringBuilder()
        report.append("FastBlake dispatch audit\n")
        report.append("shape=${shape} size=${size} bytes, 2 forks x 5 warmup x 5 measurement\n\n")
        report.append(autoLine.trim()).append('\n\n')
        scores.each { k, v ->
            def marks = []
            if (k == best.key) marks << 'fastest'
            if (k == autoKernel) marks << 'selected'
            report.append(String.format("  %-7s %6d MiB/s%s%n", k, v,
                    marks ? '   <- ' + marks.join(', ') : ''))
        }
        report.append('\n')
        if (autoKernel == null) {
            report.append('VERDICT: could not determine the automatic selection.\n')
        } else if (autoKernel == best.key) {
            report.append("VERDICT: OK. The selector picked '${autoKernel}', which is the fastest here.\n")
        } else {
            def margin = 100.0 * (best.value - (scores[autoKernel] ?: 0)) / best.value
            // The measurement protocol treats differences below ~3% as
            // inconclusive. Without this the audit cries wolf over run-to-run
            // noise, and an audit that reports a mismatch every run is one
            // nobody reads.
            if (margin < 3.0) {
                report.append(String.format(
                        "VERDICT: OK. '%s' edged out the selected '%s' by %.1f%%, "
                                + "inside the 3%% inconclusive band.%n",
                        best.key, autoKernel, margin))
            } else {
                report.append(String.format(
                        "VERDICT: MISMATCH. The selector picked '%s' but '%s' is %.1f%% faster here.%n",
                        autoKernel, best.key, margin))
                report.append('Record this machine and these numbers in '
                        + 'reference/performance/experiments.md, then update KernelSelector.\n')
            }
        }
        def text = report.toString()
        outputFile.get().asFile.text = text
        logger.lifecycle('')
        logger.lifecycle(text)
    }
}

// E027. Deep retained size of one hasher per contender, at three lifecycle
// points. Allocation rate (bytes/op) has been gated since E010; this measures
// the other axis — how much a live hasher *keeps*, which matters for any caller
// holding many of them.
//
//   ./gradlew footprint
tasks.register('footprint', JavaExec) {
    group = 'verification'
    description = 'Deep retained size per hasher, per contender (JOL).'
    mainClass = 'eu.pedrobatista.fastblake.harness.Footprint'
    classpath = sourceSets.harness.runtimeClasspath
    configureNativeAccess(it)
    // JOL reads object layout through the JDK internals it is designed for.
    // magicFieldOffset is required because the harness Hasher adapters are
    // records, and Unsafe refuses field offsets on record classes.
    systemProperty 'jol.magicFieldOffset', 'true'
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED'
}

// Packaging checks are intentionally independent of Gradle's source-set
// wiring. They inspect the actual artifact a consumer would receive, so a new
// harness class or dependency cannot accidentally leak into the library.
tasks.register('verifyLibraryJar') {
    group = 'verification'
    description = 'Verifies that the published jar contains only library code.'
    dependsOn libraryJar
    doLast {
        def jarFile = libraryJar.get().archiveFile.get().asFile
        def forbiddenPrefixes = [
                'eu/pedrobatista/fastblake/harness/',
                'eu/pedrobatista/fastblake/bench/'
        ]
        // E028 promoted Blake3ChunkVectorWide out of this list: it is now a
        // shipped kernel, reachable through -Dfastblake.kernel=wide, so the jar
        // is required to contain it.
        def archivedKernels = [
                'Blake3BlockVector', 'Blake3ChunkVector4', 'Blake3ChunkVectorHeap',
                'Blake3ChunkVectorLowLive', 'Blake3ChunkVectorRoundCache',
                'Blake3ParentVector', 'Blake3Vector'
        ].collect { "eu/pedrobatista/fastblake/${it}.class" }
        def forbiddenSuffixes = ['test_vectors.json']
        def leaked = []
        // Class-file major version is the only artefact-level proof that the
        // baseline held: 44 + feature release, so 21 -> 65. Checked per entry
        // because a single stray class compiled by another task is enough to
        // break a 21 consumer at class-load time.
        def expectedMajor = 44 + baselineJava
        def wrongVersion = [:]
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name
                if (forbiddenPrefixes.any { name.startsWith(it) }
                        || archivedKernels.contains(name)
                        || forbiddenSuffixes.any { name.endsWith(it) }) {
                    leaked << name
                }
                if (name.endsWith('.class')) {
                    zip.getInputStream(entry).withCloseable { input ->
                        def header = new java.io.DataInputStream(input)
                        // Masked to unsigned: Groovy widens 0xCAFEBABE to a
                        // positive Long, which never equals the negative int
                        // that readInt() returns.
                        if ((header.readInt() & 0xFFFFFFFFL) != 0xCAFEBABEL) {
                            throw new GradleException("Not a class file: ${name}")
                        }
                        header.readUnsignedShort()          // minor
                        def major = header.readUnsignedShort()
                        if (major != expectedMajor) {
                            wrongVersion[name] = major
                        }
                    }
                }
            }
        }
        if (!leaked.isEmpty()) {
            throw new GradleException("Library jar contains non-library entries: ${leaked}")
        }
        if (!wrongVersion.isEmpty()) {
            throw new GradleException(
                    "Library jar targets the wrong JVM. Expected class-file major ${expectedMajor} " +
                            "(Java ${baselineJava}); found: ${wrongVersion}")
        }
        logger.lifecycle("verifyLibraryJar: ${jarFile.name} contains no harness, benchmark, or test-vector entries.")
        logger.lifecycle("verifyLibraryJar: all classes are class-file major ${expectedMajor} (Java ${baselineJava}).")
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'fastblake'
            pom {
                name = 'FastBlake'
                description = project.description
                url = 'https://github.com/pedrobatista/FastBlake'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'pedrobatista'
                        name = 'Pedro Batista'
                        email = 'pedrobatistawork@gmail.com'
                        url = 'https://pedrobatista.eu'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/pedrobatista/FastBlake.git'
                    developerConnection = 'scm:git:ssh://git@github.com/pedrobatista/FastBlake.git'
                    url = 'https://github.com/pedrobatista/FastBlake'
                }
            }
        }
    }
}

// Central Portal requires signed release artifacts. Signing is deliberately
// opt-in so ordinary tests and local development never require a private key.
// Configure Gradle signing properties or an external signing command, then run
// `./gradlew centralBundle -Prelease`.
signing {
    def signingKey = providers.gradleProperty('signingInMemoryKey')
    def signingPassword = providers.gradleProperty('signingInMemoryKeyPassword')
    def signingKeyId = providers.gradleProperty('signingKeyId')
    if (signingKey.isPresent()) {
        // CI exports the signing subkey rather than the primary secret key.
        // Gradle requires the subkey id for an in-memory subkey ring; without
        // it it tries to query an absent default-key provider at execution time.
        if (!signingKeyId.isPresent() || signingKeyId.get().trim().isEmpty()) {
            throw new GradleException(
                    'signingKeyId is required when signingInMemoryKey contains a signing subkey '
                            + '(use the final 8 hex digits of its key id).')
        }
        useInMemoryPgpKeys(signingKeyId.get(), signingKey.get(), signingPassword.orElse('').get())
    }
    required { project.hasProperty('release') }
    sign publishing.publications.mavenJava
}

tasks.named('check') {
    dependsOn tasks.named('verifyLibraryJar')
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs correctness and verifies the consumer-facing library artifact.'
    dependsOn tasks.named('test'), tasks.named('verifyLibraryJar'),
            tasks.named('generatePomFileForMavenJavaPublication'),
            tasks.named('consumerSmokeTest'), tasks.named('consumerSmokeTestCurrent')
}

def centralGroupVersionDir = "${project.group.toString().replace('.', '/')}/fastblake/${project.version}"
def centralStagingDir = layout.buildDirectory.dir('central-staging').get().asFile

// Collects the exact files required by the Central Portal and adds detached
// SHA-256/SHA-512 checksums. This task never uploads credentials or performs
// network I/O.
tasks.register('centralStaging', Sync) {
    group = 'publishing'
    description = 'Stages signed artifacts and checksums for the Central Portal.'
    dependsOn tasks.named('releaseCheck'), tasks.named('signMavenJavaPublication')
    onlyIf {
        if (!project.hasProperty('release')) {
            logger.lifecycle('centralStaging: skipped; pass -Prelease to require signing.')
            return false
        }
        true
    }
    into(new File(centralStagingDir, centralGroupVersionDir))
    from(tasks.named('jar'))
    from(tasks.named('sourcesJar'))
    from(tasks.named('javadocJar'))
    from(layout.buildDirectory.dir('publications/mavenJava')) {
        include 'pom-default.xml'
        rename { "fastblake-${project.version}.pom" }
    }
    from(layout.buildDirectory.dir('publications/mavenJava')) {
        include 'module.json'
        rename { "fastblake-${project.version}.module" }
    }
    // The detached signatures must use the same renamed filenames as the
    // publication artifacts. Central derives the required artifact path from
    // each .asc filename; leaving pom-default.xml.asc beside a renamed POM
    // makes the Portal report the POM as missing.
    from(layout.buildDirectory.dir('publications/mavenJava')) {
        include 'pom-default.xml.asc'
        rename { "fastblake-${project.version}.pom.asc" }
    }
    from(layout.buildDirectory.dir('publications/mavenJava')) {
        include 'module.json.asc'
        rename { "fastblake-${project.version}.module.asc" }
    }
    from(layout.buildDirectory.dir('libs')) {
        include '*.asc'
    }
    doLast {
        def digestNames = [
                'MD5'    : 'md5',
                'SHA-1'  : 'sha1',
                'SHA-256': 'sha256',
                'SHA-512': 'sha512'
        ]
        fileTree(new File(centralStagingDir, centralGroupVersionDir)).files
                .findAll {
                    !it.name.endsWith('.asc')
                            && !it.name.endsWith('.md5')
                            && !it.name.endsWith('.sha1')
                            && !it.name.endsWith('.sha256')
                            && !it.name.endsWith('.sha512')
                }
                .each { artifact ->
                    digestNames.each { algorithm, suffix ->
                        def digest = java.security.MessageDigest.getInstance(algorithm)
                                .digest(artifact.bytes)
                        def hex = digest.collect { String.format('%02x', it & 0xff) }.join()
                        new File(artifact.parentFile, artifact.name + ".${suffix}").text = hex + System.lineSeparator()
                    }
                }
        fileTree(new File(centralStagingDir, centralGroupVersionDir)).files
                .findAll { it.name.endsWith('.asc') }
                .each { signature ->
                    def artifact = new File(signature.parentFile,
                            signature.name.substring(0, signature.name.length() - '.asc'.length()))
                    if (!artifact.isFile()) {
                        throw new GradleException(
                                "Signature ${signature.name} has no matching artifact ${artifact.name}")
                    }
                }
        logger.lifecycle("centralStaging: staged ${centralStagingDir}/${centralGroupVersionDir}")
    }
}

// Builds the archive uploaded through central.sonatype.com.
tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = "Creates the signed Maven Central Portal bundle for ${project.version}."
    dependsOn tasks.named('centralStaging')
    onlyIf {
        if (!project.hasProperty('release')) {
            logger.lifecycle('centralBundle: skipped; pass -Prelease to require signing.')
            return false
        }
        true
    }
    archiveFileName = "fastblake-${project.version}-central-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('central')
    from(centralStagingDir)
    doLast {
        def zipFile = archiveFile.get().asFile
        logger.lifecycle("centralBundle: created ${zipFile}")
        logger.lifecycle('Upload this zip from the Central Portal Publish Component page; do not commit it or its keys.')
    }
}

// A consumer-style smoke test deliberately runs without --add-modules. This
// proves the published jar can still use its scalar fallback on a JVM where
// the incubating Vector API is not resolved.
//
// It runs on a real baseline JVM, not the build toolchain. Compiling with
// --release 21 proves the API surface; only executing on 21 proves the class
// files actually load there. Running this on 25 would pass no matter what the
// baseline was set to, which is the failure mode this whole guard exists for.
tasks.register('consumerSmokeTest', JavaExec) {
    group = 'verification'
    description = "Runs a downstream-style program against the jar on Java ${baselineJava}."
    dependsOn tasks.named('compileConsumerTestJava')
    mainClass = 'eu.pedrobatista.fastblake.consumer.LibraryConsumerSmokeTest'
    classpath = sourceSets.consumerTest.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(baselineJava)
    }
}

// The same program on the build toolchain: one jar, both ends of the supported
// range. Catches a baseline artefact that a newer JVM refuses to load.
tasks.register('consumerSmokeTestCurrent', JavaExec) {
    group = 'verification'
    description = 'Runs the downstream-style program on the build toolchain JVM.'
    dependsOn tasks.named('compileConsumerTestJava')
    mainClass = 'eu.pedrobatista.fastblake.consumer.LibraryConsumerSmokeTest'
    classpath = sourceSets.consumerTest.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
