import org.gradle.process.ExecOperations

import javax.inject.Inject

plugins {
    id 'java'
    id 'maven-publish'
}

group 'com.pedrobatista'
version '0.1.0'

description = 'Dependency-free pure-JVM BLAKE3 implementation'

// The main jar is the library boundary. Harnesses, benchmarks and native
// contenders are deliberately separate source sets and are never runtime
// dependencies of this artifact.
def libraryJar = tasks.named('jar')

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

ext {
    commonsCodecVersion = '1.22.0'
    junitVersion = '5.12.2'
    jmhVersion = '1.37'
    jolVersion = '0.17'
}

// ---------------------------------------------------------------------------
// Source layout
//
//   src/main     the implementations under development (Java CPU, later GPU)
//   src/experiment historical/candidate kernels; compiled for the laboratory,
//                 never included in the library jar
//   src/harness  contender adapters + official test vectors, shared by both
//                consumers below so tests and benchmarks measure the same code
//   src/test     conformance, run over every available contender
//   src/jmh      benchmarks, run over every available contender
//
// Only `main` ships. Commons Codec, JMH and the harness never reach the jar.
// ---------------------------------------------------------------------------
sourceSets {
    experiment {
        java.srcDirs = ['src/experiment/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    harness {
        java.srcDirs = ['src/harness/java']
        resources.srcDirs = ['src/harness/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.harness.output
        runtimeClasspath += sourceSets.harness.output
    }
    jmh {
        java.srcDirs = ['src/jmh/java']
        compileClasspath += sourceSets.main.output + sourceSets.experiment.output + sourceSets.harness.output
        runtimeClasspath += sourceSets.main.output + sourceSets.experiment.output + sourceSets.harness.output
    }
}

configurations {
    experimentImplementation.extendsFrom implementation
}

configurations {
    testImplementation.extendsFrom harnessImplementation
    jmhImplementation.extendsFrom harnessImplementation
}

dependencies {
    // Apache Commons Codec is a contender and the correctness oracle. It is a
    // harness dependency only -- `main` has no dependencies and never will.
    harnessImplementation "commons-codec:commons-codec:${commonsCodecVersion}"
    // E027: retained-footprint measurement. Harness scope only; `main` stays
    // dependency-free.
    harnessImplementation "org.openjdk.jol:jol-core:${jolVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    jmhImplementation "org.openjdk.jmh:jmh-core:${jmhVersion}"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}"
}

// ---------------------------------------------------------------------------
// Rust contender (optional)
//
// The reference Rust implementation is compiled to a cdylib and called through
// the FFM API, so it is measured in-process on the same buffers as the Java
// contenders. This is strictly best-effort: no Rust toolchain, a broken crate
// build, or an unsupported platform must all leave `build`, `test` and `jmh`
// fully working, with the Rust contender simply reported as unavailable.
// ---------------------------------------------------------------------------
interface InjectedExec {
    @Inject
    ExecOperations getExecOps()
}

// Gradle's daemon often has a narrower PATH than an interactive shell, so look
// in the usual toolchain locations too before declaring cargo missing.
def cargoExecutable = {
    def dirs = []
    def envPath = System.getenv('PATH')
    if (envPath) {
        dirs.addAll(envPath.split(File.pathSeparator).findAll { it }.collect { new File(it) })
    }
    dirs << new File(System.getProperty('user.home'), '.cargo/bin')
    dirs << new File('/opt/homebrew/bin')
    dirs << new File('/usr/local/bin')
    def exeSuffix = System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''
    for (dir in dirs) {
        def candidate = new File(dir, "cargo${exeSuffix}")
        if (candidate.isFile() && candidate.canExecute()) {
            return candidate.absolutePath
        }
    }
    return null
}()

def nativeLibName = System.mapLibraryName('fastblake_rust')
def rustProjectDir = layout.projectDirectory.dir('native/rust-blake3')
def nativeStageDir = layout.buildDirectory.dir('native')

tasks.register('cargoBuild') {
    group = 'build'
    description = 'Builds the Rust BLAKE3 contender. Skipped, not failed, when cargo is unavailable.'

    def injected = objects.newInstance(InjectedExec)
    def rustDir = rustProjectDir.asFile
    def stageDir = nativeStageDir
    def cargo = cargoExecutable
    def libName = nativeLibName

    inputs.files(fileTree(rustDir) {
        include 'src/**'
        include 'Cargo.toml'
        include 'Cargo.lock'
    }).withPropertyName('rustSources')
    inputs.property('cargoExecutable', cargo ?: 'absent')
    outputs.dir(stageDir).withPropertyName('nativeStage')

    doLast {
        def dest = stageDir.get().asFile
        dest.mkdirs()
        def staged = new File(dest, libName)
        def status = new File(dest, 'rust-status.txt')
        staged.delete()

        if (cargo == null) {
            status.text = "unavailable\nNo cargo executable found on PATH or in the usual toolchain " +
                    "locations. Install Rust (https://rustup.rs) and re-run to enable the Rust contender."
            logger.lifecycle('cargoBuild: cargo not found -- Rust contender disabled.')
            return
        }

        def stdout = new ByteArrayOutputStream()
        def result = injected.execOps.exec {
            commandLine cargo, 'build', '--release'
            workingDir rustDir
            standardOutput = stdout
            errorOutput = stdout
            ignoreExitValue = true
        }

        if (result.exitValue != 0) {
            status.text = "unavailable\ncargo build --release failed with exit code ${result.exitValue}. " +
                    "Run it by hand in ${rustDir} to see why.\n\n${stdout}"
            logger.lifecycle("cargoBuild: cargo build failed (exit ${result.exitValue}) -- Rust contender disabled.")
            logger.info(stdout.toString())
            return
        }

        def built = new File(rustDir, "target/release/${libName}")
        if (!built.isFile()) {
            status.text = "unavailable\ncargo build succeeded but ${built} was not produced. " +
                    "Is the crate-type still cdylib for this platform?"
            logger.lifecycle('cargoBuild: no shared library produced -- Rust contender disabled.')
            return
        }

        staged.bytes = built.bytes
        status.text = "available\n${built}"
        logger.lifecycle("cargoBuild: staged ${libName} -- Rust contender enabled.")
    }
}

// Both consumers need the staged library (or the status file explaining its
// absence) before they run.
def configureNativeAccess = { task ->
    task.dependsOn tasks.named('cargoBuild')
    task.systemProperty 'fastblake.native.dir', nativeStageDir.get().asFile.absolutePath
    // FFM downcalls are a restricted operation; without this the JVM prints a
    // warning on every run that would otherwise look like a harness failure.
    task.jvmArgs '--enable-native-access=ALL-UNNAMED'
    task.jvmArgs '--add-modules=jdk.incubator.vector'
}

test {
    useJUnitPlatform()
    configureNativeAccess(it)
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// ./gradlew jmh                                     -> every available contender
// ./gradlew jmh -P'jmh.args=oneShot -p size=1024'   -> raw JMH args
// ./gradlew jmh -P'jmh.args=-p impl=rust,commons'   -> pick contenders explicitly
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Runs the BLAKE3 benchmarks across every available contender.'
    dependsOn tasks.named('jmhClasses')
    mainClass = 'com.pedrobatista.fastblake.bench.BenchmarkRunner'
    classpath = sourceSets.jmh.runtimeClasspath
    configureNativeAccess(it)
    def rawArgs = (project.findProperty('jmh.args') ?: '').toString().trim()
    args = rawArgs.isEmpty() ? [] : rawArgs.split('\\s+').toList()
}

// Reports which contenders this machine can actually run, and why any are out.
tasks.register('contenders', JavaExec) {
    group = 'verification'
    description = 'Prints the availability of every BLAKE3 contender on this machine.'
    mainClass = 'com.pedrobatista.fastblake.harness.Contenders'
    classpath = sourceSets.harness.runtimeClasspath
    configureNativeAccess(it)
}

// E025 P3. Benchmarks every selectable kernel on this machine and reports
// whether the one KernelSelector picked actually won.
//
// The dispatch table in KernelSelector encodes measured results, and a table
// nobody re-checks is an assumption rather than a measurement. This is the
// check. It matters because the ground moves: E024 measured a ~15% swing on
// identical code between two JDK builds, and a JDK on this machine changed
// underneath the build mid-session.
//
//   ./gradlew dispatchAudit
//   ./gradlew dispatchAudit -PauditSize=1048576 -PauditShape=streaming4k
tasks.register('dispatchAudit') {
    group = 'verification'
    description = 'Benchmarks every selectable kernel and checks the selector chose the best.'
    dependsOn tasks.named('jmhClasses')

    def injected = objects.newInstance(InjectedExec)
    def jmhClasspath = sourceSets.jmh.runtimeClasspath
    def nativeDir = nativeStageDir.get().asFile.absolutePath
    def javaLauncher = javaToolchains.launcherFor(java.toolchain)
    def size = (project.findProperty('auditSize') ?: '8388608').toString()
    def shape = (project.findProperty('auditShape') ?: 'oneShot').toString()
    def outputFile = layout.buildDirectory.file('dispatch-audit.txt')
    outputs.file(outputFile)
    // A measurement is never up to date: the answer depends on the machine, the
    // JDK and thermal state, none of which Gradle can see. Caching it would let
    // a stale verdict rubber-stamp a changed dispatch table.
    outputs.upToDateWhen { false }

    doLast {
        def kernels = ['scalar', 'four', 'eight']
        def scores = [:]
        def selected = null

        kernels.each { kernel ->
            logger.lifecycle("dispatchAudit: measuring ${kernel} at ${shape}/${size} ...")
            def out = new ByteArrayOutputStream()
            def result = injected.execOps.javaexec {
                executable = javaLauncher.get().executablePath.asFile.absolutePath
                classpath = jmhClasspath
                mainClass = 'com.pedrobatista.fastblake.bench.BenchmarkRunner'
                systemProperty 'fastblake.native.dir', nativeDir
                // The kernel override must reach the JMH *fork*, not just this
                // host process. JMH child JVMs do not inherit arbitrary -D
                // flags, so an audit that set only a systemProperty measured
                // the same kernel three times and always reported "OK".
                // JAVA_TOOL_OPTIONS is inherited through the environment and is
                // how every other run in this project propagates the flag.
                environment 'JAVA_TOOL_OPTIONS', "-Dfastblake.kernel=${kernel}"
                jvmArgs '--enable-native-access=ALL-UNNAMED',
                        '--add-modules=jdk.incubator.vector'
                args shape, '-p', 'impl=java-cpu', '-p', "size=${size}",
                        '-f', '2', '-wi', '5', '-i', '5'
                standardOutput = out
                errorOutput = out
                ignoreExitValue = true
            }
            def text = out.toString()
            if (result.exitValue != 0) {
                logger.lifecycle("  ${kernel}: FAILED (exit ${result.exitValue})")
                logger.info(text)
                return
            }
            // The runner prints "<size label>  <MiB/s>" in its summary table.
            def score = null
            text.eachLine { line ->
                def m = line =~ /^\s{2,}\S+\s+(?:B|KiB|MiB)\s+([0-9]+)\s*$/
                if (m.find()) {
                    score = m.group(1) as int
                }
            }
            if (score == null) {
                logger.lifecycle("  ${kernel}: no score parsed")
                logger.info(text)
            } else {
                scores[kernel] = score
                logger.lifecycle("  ${kernel}: ${score} MiB/s")
            }
            // Every run prints the selection line; capture it once.
            text.eachLine { line ->
                if (selected == null && line.contains('-> ') && line.contains('java-cpu')) {
                    selected = line.trim()
                }
            }
        }

        if (scores.isEmpty()) {
            throw new GradleException('dispatchAudit produced no scores; see --info for output.')
        }

        def best = scores.max { it.value }
        // Map the automatic choice onto a kernel key. Run once more with no
        // override so the selector reports what it would pick unaided.
        def autoOut = new ByteArrayOutputStream()
        injected.execOps.javaexec {
            executable = javaLauncher.get().executablePath.asFile.absolutePath
            classpath = jmhClasspath
            mainClass = 'com.pedrobatista.fastblake.harness.Contenders'
            systemProperty 'fastblake.native.dir', nativeDir
            jvmArgs '--enable-native-access=ALL-UNNAMED',
                    '--add-modules=jdk.incubator.vector'
            standardOutput = autoOut
            errorOutput = autoOut
            ignoreExitValue = true
        }
        def autoLine = autoOut.toString().readLines().find { it.contains('java-cpu') } ?: ''
        def autoKernel = autoLine.contains('EIGHT_CHUNK') ? 'eight'
                : autoLine.contains('FOUR_CHUNK') ? 'four'
                : autoLine.contains('SCALAR') ? 'scalar' : null

        def report = new StringBuilder()
        report.append("FastBlake dispatch audit\n")
        report.append("shape=${shape} size=${size} bytes, 2 forks x 5 warmup x 5 measurement\n\n")
        report.append(autoLine.trim()).append('\n\n')
        scores.each { k, v ->
            def marks = []
            if (k == best.key) marks << 'fastest'
            if (k == autoKernel) marks << 'selected'
            report.append(String.format("  %-7s %6d MiB/s%s%n", k, v,
                    marks ? '   <- ' + marks.join(', ') : ''))
        }
        report.append('\n')
        if (autoKernel == null) {
            report.append('VERDICT: could not determine the automatic selection.\n')
        } else if (autoKernel == best.key) {
            report.append("VERDICT: OK. The selector picked '${autoKernel}', which is the fastest here.\n")
        } else {
            def margin = 100.0 * (best.value - (scores[autoKernel] ?: 0)) / best.value
            // The measurement protocol treats differences below ~3% as
            // inconclusive. Without this the audit cries wolf over run-to-run
            // noise, and an audit that reports a mismatch every run is one
            // nobody reads.
            if (margin < 3.0) {
                report.append(String.format(
                        "VERDICT: OK. '%s' edged out the selected '%s' by %.1f%%, "
                                + "inside the 3%% inconclusive band.%n",
                        best.key, autoKernel, margin))
            } else {
                report.append(String.format(
                        "VERDICT: MISMATCH. The selector picked '%s' but '%s' is %.1f%% faster here.%n",
                        autoKernel, best.key, margin))
                report.append('Record this machine and these numbers in '
                        + 'reference/performance/experiments.md, then update KernelSelector.\n')
            }
        }
        def text = report.toString()
        outputFile.get().asFile.text = text
        logger.lifecycle('')
        logger.lifecycle(text)
    }
}

// E027. Deep retained size of one hasher per contender, at three lifecycle
// points. Allocation rate (bytes/op) has been gated since E010; this measures
// the other axis — how much a live hasher *keeps*, which matters for any caller
// holding many of them.
//
//   ./gradlew footprint
tasks.register('footprint', JavaExec) {
    group = 'verification'
    description = 'Deep retained size per hasher, per contender (JOL).'
    mainClass = 'com.pedrobatista.fastblake.harness.Footprint'
    classpath = sourceSets.harness.runtimeClasspath
    configureNativeAccess(it)
    // JOL reads object layout through the JDK internals it is designed for.
    // magicFieldOffset is required because the harness Hasher adapters are
    // records, and Unsafe refuses field offsets on record classes.
    systemProperty 'jol.magicFieldOffset', 'true'
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED'
}

// Packaging checks are intentionally independent of Gradle's source-set
// wiring. They inspect the actual artifact a consumer would receive, so a new
// harness class or dependency cannot accidentally leak into the library.
tasks.register('verifyLibraryJar') {
    group = 'verification'
    description = 'Verifies that the published jar contains only library code.'
    dependsOn libraryJar
    doLast {
        def jarFile = libraryJar.get().archiveFile.get().asFile
        def forbiddenPrefixes = [
                'com/pedrobatista/fastblake/harness/',
                'com/pedrobatista/fastblake/bench/'
        ]
        def archivedKernels = [
                'Blake3BlockVector', 'Blake3ChunkVector4', 'Blake3ChunkVectorHeap',
                'Blake3ChunkVectorLowLive', 'Blake3ChunkVectorRoundCache',
                'Blake3ChunkVectorWide', 'Blake3ParentVector', 'Blake3Vector'
        ].collect { "com/pedrobatista/fastblake/${it}.class" }
        def forbiddenSuffixes = ['test_vectors.json']
        def leaked = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                def name = entry.name
                if (forbiddenPrefixes.any { name.startsWith(it) }
                        || archivedKernels.contains(name)
                        || forbiddenSuffixes.any { name.endsWith(it) }) {
                    leaked << name
                }
            }
        }
        if (!leaked.isEmpty()) {
            throw new GradleException("Library jar contains non-library entries: ${leaked}")
        }
        logger.lifecycle("verifyLibraryJar: ${jarFile.name} contains no harness, benchmark, or test-vector entries.")
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'FastBlake'
                description = project.description
                url = 'https://github.com/pedrobatista/FastBlake'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/pedrobatista/FastBlake.git'
                    developerConnection = 'scm:git:ssh://git@github.com/pedrobatista/FastBlake.git'
                    url = 'https://github.com/pedrobatista/FastBlake'
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyLibraryJar')
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs correctness and verifies the consumer-facing library artifact.'
    dependsOn tasks.named('test'), tasks.named('verifyLibraryJar'), tasks.named('generatePomFileForMavenJavaPublication')
}
